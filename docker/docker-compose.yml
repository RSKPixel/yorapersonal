name: yorapersonal

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8006}:8006"
    networks:
      - yorapersonal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8088}:8080"
    networks:
      - yorapersonal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  yorapersonal:
    name: yorapersonal
